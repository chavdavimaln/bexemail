# Nginx Configuration for BexEmail
# Save this file to /etc/nginx/sites-available/bexemail
# Then run: sudo ln -s /etc/nginx/sites-available/bexemail /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your actual domain

    # 1. Serve static ReactJS frontend
    root /var/www/bexemail/client/dist;
    index index.html;

    location / {
        # Fallback to index.html for React Router History API
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy for Node.js API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        
        # Set appropriate headers to pass client IP data
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed for future features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Optional: Deny access to hidden files (.env, .git)
    location ~ /\. {
        deny all;
    }
}
