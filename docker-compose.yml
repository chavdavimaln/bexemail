version: '3.9'

services:
  # ─────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: bexemail_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-bexemail_root}
      MYSQL_DATABASE: ${DB_NAME:-bexemail}
      MYSQL_USER: ${DB_USER:-bexemail_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bexemail_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # Redis (BullMQ Broker)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bexemail_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # BexEmail API Server
  # ─────────────────────────────────────────
  api:
    build:
      context: ./bexemail-server
      dockerfile: Dockerfile.server
    container_name: bexemail_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./bexemail-server/.env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      NODE_ENV: production
    ports:
      - "5000:5000"

  # ─────────────────────────────────────────
  # BullMQ Background Worker
  # ─────────────────────────────────────────
  worker:
    build:
      context: ./bexemail-server
      dockerfile: Dockerfile.worker
    container_name: bexemail_worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./bexemail-server/.env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      NODE_ENV: production

  # ─────────────────────────────────────────
  # React Frontend (served by Nginx)
  # ─────────────────────────────────────────
  client:
    build:
      context: ./bexemail-client
      dockerfile: Dockerfile.client
    container_name: bexemail_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql_data:
    driver: local
